<!DOCTYPE html>
<html>
<head>
   <title>Ujian Umur</title>
   <script>
     let umur = parseInt(prompt("Masukkan umur anda:"));

     if (umur < 5) {
       alert("Bukan remaja");
     } else {
       alert(umur === 30 ? "Dewasa" : "Umur tidak termasuk dalam kategori remaja");
     }
   </script>
</head>
<body>
    <h1>Ujian Kategori Umur</h1>
</body>
</html>
